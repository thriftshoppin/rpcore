<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<title>RPCore Weapon</title>
<style>
  /* RPCore weapon readout: name, state, and rounds, right-aligned to the
     screen edge. A thin rule on the outer edge carries the state colour:
     amber holstered, green drawn, red when the magazine runs low. */
  @font-face{ font-family:Rajdhani; font-weight:700; src:url(fonts/rajdhani-latin-700-normal.woff2) format('woff2'); }
  @font-face{ font-family:'IBM Plex Mono'; font-weight:700; src:url(fonts/ibm-plex-mono-latin-700-normal.woff2) format('woff2'); }
  *{ box-sizing:border-box; margin:0; padding:0; }
  html,body{ background:transparent; overflow:hidden; width:100%; height:100%; }
  /* Perspective depth is measured from screen center so the lean reads as 3D. */
  body{ perspective:900px; perspective-origin:50% 50%; }
  body{ font-family:Rajdhani,'Bahnschrift Condensed','Arial Narrow',sans-serif; color:#f2f6f8; }
  :root{ --drawn:#4ade80; --holstered:#ffb020; --low:#ff5c5c; --muted:#b9c4ca;
    --edge: 1px 1px 0 rgba(0,0,0,.85), -1px 1px 0 rgba(0,0,0,.85), 1px -1px 0 rgba(0,0,0,.85),
            -1px -1px 0 rgba(0,0,0,.85), 0 2px 6px rgba(0,0,0,.6); }

  .weapon-hud{ position:absolute; right:24px; bottom:24px; display:none;
    padding:2px 14px 2px 0; border-right:2px solid var(--state);
    text-align:right; text-shadow:var(--edge);
    --state: var(--holstered);
    transition:opacity .25s ease, border-color .2s ease;
    /* The OPX visor tilt (7deg), right-hand facet: turns about its outer edge.
       The state rule glows softly. */
    box-shadow: 4px 0 8px -4px var(--state);
    transform:rotateY(-7deg); transform-origin:right center; }
  body[data-visible="true"][data-weapon="true"] .weapon-hud{ display:block; }
  .weapon-hud.drawn{ --state: var(--drawn); }
  .weapon-hud.drawn.low-ammo{ --state: var(--low); }

  #weapon-name{ display:block; font-size:17px; font-weight:700; letter-spacing:.02em; line-height:1.1;
    white-space:nowrap; max-width:340px; overflow:hidden; text-overflow:ellipsis; }
  .wh-meta{ margin-top:4px; font-size:11px; font-weight:600; letter-spacing:.18em; color:var(--muted);
    text-transform:uppercase; white-space:nowrap; }
  .wh-meta .dot{ margin:0 6px; opacity:.6; }
  #weapon-state{ color:var(--state); font-weight:700; text-shadow: 0 0 5px var(--state), 1px 1px 0 rgba(0,0,0,.85); }

  .wh-count{ margin-top:6px; line-height:1; font-family:'IBM Plex Mono',Consolas,monospace; font-variant-numeric:tabular-nums; white-space:nowrap; }
  #ammo-magazine{ font-size:34px; font-weight:800; letter-spacing:-.01em; }
  .wh-sep{ font-size:20px; font-weight:300; color:rgba(255,255,255,.6); margin:0 4px; }
  #ammo-reserve{ font-size:17px; font-weight:600; color:rgba(255,255,255,.8); }
  .low-ammo #ammo-magazine{ color:var(--low); }
  .holstered .wh-count{ opacity:.55; }
  .melee .wh-count{ display:none; }

  @media (max-width:1400px), (max-height:800px){
    .weapon-hud{ right:16px; bottom:16px; transform:rotateY(-7deg) scale(.88); } }
</style>
</head>
<body data-visible="false" data-weapon="false">
  <section class="weapon-hud" id="weapon-hud" data-layout-id="weapon" aria-label="Active weapon">
    <strong id="weapon-name">Weapon</strong>
    <div class="wh-meta"><span id="weapon-type">WEAPON</span><span class="dot">&middot;</span><span id="weapon-state">HOLSTERED</span></div>
    <div class="wh-count"><span id="ammo-magazine">--</span><span class="wh-sep">/</span><span id="ammo-reserve">--</span></div>
  </section>
  <script src="weapon-icons.js"></script>
  <script src="weapon.js"></script>
  <script src="../layout.js"></script>
  <script>RPCoreLayoutInstall('weapon', ['weapon']);</script>
</body>
</html>
